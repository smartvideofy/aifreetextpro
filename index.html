<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free AI Detector and Humanizer (2-in-1) | 250 Words Free</title>
    <meta data-rh="true" name="description" content="Free AI detector and humanizer in one tool. Check your AI score, then rewrite flagged lines in your own voice. 250 free words a month, free account, no card." />
    <meta name="author" content="AI Free Text Pro" />
    <meta name="google-site-verification" content="dH6cHuhLm6VUXCkGSjVR-I7BQ1fu35OvbpZ4ybXOtb0" />

    <!-- NOTE: per-route canonical and social metadata override the homepage
         fallbacks through react-helmet-async during prerendering. Do NOT add a
         static <link rel="canonical"> here, it would create a duplicate canonical
         after Helmet hydrates and collapse every route to "/" for crawlers. -->

    <!-- Sitewide OG image (overrides any host-injected preview image).
         Per-route OG image, title, description are set by Helmet on each route. -->
    <meta data-rh="true" property="og:title" content="Free AI Detector and Humanizer (2-in-1) | 250 Words Free" />
    <meta data-rh="true" property="og:description" content="Free AI detector and humanizer in one tool. Check your AI score, then rewrite flagged lines in your own voice. 250 free words a month, free account, no card." />
    <meta data-rh="true" property="og:url" content="https://aifreetextpro.com/" />
    <meta property="og:image" content="https://aifreetextpro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AI Free Text Pro - AI Humanizer & Detector" />
    <meta property="og:site_name" content="AI Free Text Pro" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Free AI Detector and Humanizer (2-in-1) | 250 Words Free" />
    <meta data-rh="true" name="twitter:description" content="Free AI detector and humanizer in one tool. Check your AI score, then rewrite flagged lines in your own voice. 250 free words a month, free account, no card." />
    <meta name="twitter:site" content="@aifreetextpro" />
    <meta name="twitter:image" content="https://aifreetextpro.com/og-image.png" />

    <!-- Preconnect to critical domains -->

    <!-- Favicons & app icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6D3FC4" />

    <!-- Per-page JSON-LD is emitted by React Helmet during prerendering. -->
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
