<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free AI Detector and Humanizer (2-in-1) | 1,000 Words Free</title>
    <meta name="description" content="Humanize AI text and reduce false flags from Turnitin, GPTZero & Originality.AI free. 1,000 words monthly, no signup, 98% accuracy. Trusted by 50,000+ writers." />
    <meta name="author" content="AI Free Text Pro" />
    <meta name="google-site-verification" content="dH6cHuhLm6VUXCkGSjVR-I7BQ1fu35OvbpZ4ybXOtb0" />

    <!-- NOTE: per-route canonical, og:title, og:description, og:url, twitter:* are
         emitted by src/components/SEOHead.tsx via react-helmet-async. Do NOT add a
         static <link rel="canonical"> here, it would create a duplicate canonical
         after Helmet hydrates and collapse every route to "/" for crawlers. -->

    <!-- Sitewide OG image (overrides any host-injected preview image).
         Per-route OG image, title, description are set by Helmet on each route. -->
    <meta property="og:image" content="https://aifreetextpro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AI Free Text Pro - AI Humanizer & Detector" />
    <meta property="og:site_name" content="AI Free Text Pro" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aifreetextpro" />
    <meta name="twitter:image" content="https://aifreetextpro.com/og-image.png" />

    <!-- Preconnect to critical domains -->

    <!-- Favicons & app icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6D3FC4" />

    <!-- Per-page JSON-LD is emitted by React Helmet during prerendering. -->
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
